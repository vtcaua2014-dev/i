name: Build LiveTimer

on:
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"
  push:
    branches: [main]   # e roda sozinho a cada alteração na branch main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Compilar o dylib
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -fobjc-arc \
            -miphoneos-version-min=12.0 \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -o LiveTimer.dylib LiveTimer.m
          file LiveTimer.dylib

      - name: Guardar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: LiveTimer-dylib
          path: LiveTimer.dylib
